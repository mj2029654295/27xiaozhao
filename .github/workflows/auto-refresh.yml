name: 自动刷新校招表格

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - run: python refresh_campus.py
      - run: cp 27届校招信息汇总表.html index.html
      - run: |
          git config user.name "CampusBot"
          git config user.email "bot@campus.local"
          git add 27届校招信息汇总表.html campus_data.py refresh.log index.html
          git diff --staged --quiet || git commit -m "自动刷新"
          git push

